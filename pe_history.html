<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector PE History</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; }
        .navbar-brand { font-weight: 700; font-size: 1.2rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .card-header { background: transparent; border-bottom: 1px solid #334155; font-weight: 600; }
        .sector-badge {
            display: inline-block; padding: 4px 10px; border-radius: 20px;
            font-size: 0.75rem; cursor: pointer; margin: 3px; user-select: none;
            border: 2px solid transparent; transition: opacity 0.2s;
        }
        .sector-badge.hidden { opacity: 0.35; }
        .range-btn { font-size: 0.8rem; padding: 4px 12px; }
        #peChart { min-height: 500px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark px-4 py-3" style="background: #1e293b; border-bottom: 1px solid #334155;">
        <a class="navbar-brand" href="/">&#8592; Market Intelligence</a>
        <span class="text-secondary" style="font-size:0.9rem;">Sector PE History</span>
    </nav>

    <div class="container-fluid py-4 px-4">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Historical Trailing PE by Sector</span>
                <div class="btn-group" id="rangeSelector">
                    <button class="btn btn-outline-secondary range-btn" data-days="90">3M</button>
                    <button class="btn btn-outline-secondary range-btn active" data-days="180">6M</button>
                    <button class="btn btn-outline-secondary range-btn" data-days="365">1Y</button>
                </div>
            </div>
            <div class="card-body">
                <div id="peChart"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Sectors <small class="text-secondary ms-2">click to toggle</small></div>
            <div class="card-body" id="sectorToggles">
                <div class="text-secondary">Loading...</div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="config.js"></script>
    <script>
        const COLORS = [
            '#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6',
            '#06b6d4','#f97316','#84cc16','#ec4899','#6366f1',
            '#14b8a6','#f43f5e','#a855f7','#0ea5e9','#22c55e',
            '#eab308','#64748b','#d946ef','#fb923c','#34d399'
        ];

        let chart = null;
        let allSeries = [];
        let hiddenSectors = new Set();
        let currentDays = 180;

        async function loadData(days) {
            $('#peChart').html('<div class="text-center py-5 text-secondary">Loading...</div>');
            try {
                const res = await fetch(`${API_BASE_URL}/api/sector-pe-history?days=${days}`);
                const data = await res.json();
                if (!data.sectors || data.sectors.length === 0) {
                    $('#peChart').html('<div class="text-center py-5 text-secondary">No PE data yet. Backfill may still be running.</div>');
                    $('#sectorToggles').html('<div class="text-secondary">No data available.</div>');
                    return;
                }
                allSeries = data.sectors.map((s, i) => ({
                    name: s.name,
                    color: COLORS[i % COLORS.length],
                    data: s.data.map(p => ({ x: new Date(p.date).getTime(), y: p.pe }))
                }));
                renderChart();
                renderToggles();
            } catch (e) {
                $('#peChart').html('<div class="text-center py-5 text-danger">Failed to load data.</div>');
            }
        }

        function getVisibleSeries() {
            return allSeries.filter(s => !hiddenSectors.has(s.name));
        }

        function renderChart() {
            const visible = getVisibleSeries();
            const options = {
                chart: {
                    type: 'line', height: 500, background: 'transparent',
                    toolbar: { show: true },
                    zoom: { enabled: true }
                },
                series: visible,
                stroke: { width: 2, curve: 'smooth' },
                xaxis: { type: 'datetime', labels: { style: { colors: '#94a3b8' } } },
                yaxis: {
                    title: { text: 'Trailing PE', style: { color: '#94a3b8' } },
                    labels: {
                        formatter: v => v.toFixed(1) + 'x',
                        style: { colors: '#94a3b8' }
                    }
                },
                tooltip: {
                    theme: 'dark',
                    x: { format: 'MMM dd yyyy' },
                    y: { formatter: v => v.toFixed(1) + 'x' }
                },
                legend: { show: false },
                grid: { borderColor: '#334155' },
                theme: { mode: 'dark' }
            };

            if (chart) {
                chart.updateOptions({ series: visible });
            } else {
                $('#peChart').html('');
                chart = new ApexCharts(document.querySelector('#peChart'), options);
                chart.render();
            }
        }

        function renderToggles() {
            const container = $('#sectorToggles').empty();
            allSeries.forEach(s => {
                const hidden = hiddenSectors.has(s.name);
                const badge = $(`<span class="sector-badge ${hidden ? 'hidden' : ''}">${s.name}</span>`)
                    .css({ background: s.color + '22', borderColor: s.color, color: s.color })
                    .on('click', function () {
                        if (hiddenSectors.has(s.name)) {
                            hiddenSectors.delete(s.name);
                            $(this).removeClass('hidden');
                        } else {
                            hiddenSectors.add(s.name);
                            $(this).addClass('hidden');
                        }
                        chart.updateOptions({ series: getVisibleSeries() });
                    });
                container.append(badge);
            });
        }

        $('#rangeSelector').on('click', '.range-btn', function () {
            $('.range-btn').removeClass('active');
            $(this).addClass('active');
            currentDays = parseInt($(this).data('days'));
            chart = null;
            loadData(currentDays);
        });

        loadData(currentDays);
    </script>
</body>
</html>
